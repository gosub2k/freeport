# CreateVolume NOT called — this hand-binds a PV to a volume ID that must
# already exist as a directory on some node's mounted device. Normal
# provisioning (see kustomize/base/storageclass-example.yaml) gets both of
# the fields below set automatically by the csi-provisioner sidecar from the
# CSI CreateVolume response; a manually authored PV has to supply them
# itself, or NodePublishVolume rejects it and the scheduler can place it on
# any node, not just one that actually carries this device class:
#   - csi.volumeAttributes.storageClassName: NodePublishVolume requires this
#     key present in VolumeContext regardless of how the PV was created.
#   - nodeAffinity: the only thing that ties this PV to a node carrying a
#     matching freeport.local/<manufacturer>-<model>=true label.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: scratch-vol-explici-create
spec:
  capacity:
    storage: 1Gi
  # volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  csi:
    driver: freeport.local
    volumeHandle: foobar # assumes this exists
    volumeAttributes:
      storageClassName: freeport-generic
  storageClassName: freeport-generic
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: freeport.local/generic-usb-disk-2.0
          operator: In
          values: ["true"]

