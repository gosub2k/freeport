---
kind: Pod
apiVersion: v1
metadata:
  name: test-csi-driver-inline
spec:
  volumes:
    
  - name: scratch-vol-inline
    # storage: 1Gi
    csi:
      # volumeHandle: foobar
      driver: freeport.local
      # volumeHandle: foobar
      storageClassName: freeport-generic

    
  containers:
    
    - name: test-script
      image: busybox
      command: [ "sh", "-c", "echo hello > /data/hello.txt && if [[ $(cat /data/hello.txt) = hello ]]; then echo 'read and write to volume worked!';sleep 19999;  else exit 1; fi"]
      volumeMounts:
      - mountPath: "/data"
        name: scratch-vol-inline
---
