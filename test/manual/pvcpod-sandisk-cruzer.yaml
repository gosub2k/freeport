# Manual test for the freeport-sandisk-cruzer StorageClass
# (kustomize/base/storageclass-example.yaml), which requires
# freeport.local/sandisk-cruzer=true — i.e. some node must actually have a
# real SanDisk Cruzer plugged in right now. Unlike freeport-generic or
# freeport-unknown-usb-disk, this one won't bind on just any node — that's
# the point: it's the easiest StorageClass to use to manually verify
# device-class-specific topology routing end to end.
#
# --- How to test ---
#
# 1. Confirm which node(s) currently have a SanDisk Cruzer attached:
#
#      kubectl get nodes -o json | jq -r '
#        .items[] | select(.metadata.labels["freeport.local/sandisk-cruzer"]=="true")
#        | .metadata.name'
#
#    If this prints nothing, plug a SanDisk Cruzer into some node and wait
#    ~15s (the manager's reconcile interval) for it to show up.
#
# 2. Apply this file:
#
#      kubectl apply -f test/manual/pvcpod-sandisk-cruzer.yaml
#
# 3. Watch the PVC bind (WaitForFirstConsumer means it stays Pending until
#    the pod is scheduled):
#
#      kubectl get pvc scratch-pvc-sandisk-cruzer -w
#
# 4. Confirm the pod actually landed on one of the node(s) from step 1:
#
#      kubectl get pod test-csi-driver-sandisk-cruzer -o jsonpath='{.spec.nodeName}'
#
# 5. Confirm the read/write check inside the container succeeded:
#
#      kubectl logs test-csi-driver-sandisk-cruzer
#      # want: "read and write to volume worked!"
#
# 6. (optional) Confirm the actual topology mechanism, not just that it
#    happened to bind — the PV should carry a nodeAffinity requiring
#    exactly the label checked in step 1:
#
#      PV=$(kubectl get pvc scratch-pvc-sandisk-cruzer -o jsonpath='{.spec.volumeName}')
#      kubectl get pv "$PV" -o jsonpath='{.spec.nodeAffinity}' | jq .
#
# 7. Clean up:
#
#      ./test/manual/cleanup-pod.sh test-csi-driver-sandisk-cruzer
#
#    (removes the pod, the PV, and the PVC — freeport-sandisk-cruzer uses
#    reclaimPolicy: Retain, so the PV won't disappear on its own just from
#    deleting the pod or even the PVC)

kind: Pod
apiVersion: v1
metadata:
  name: test-csi-driver-sandisk-cruzer
spec:
  # busybox's `sh -c "... && sleep N"` doesn't forward SIGTERM to the sleep
  # promptly, so deletion otherwise sits at the default 30s grace period.
  terminationGracePeriodSeconds: 2

  volumes:
    - name: scratch-pv
      persistentVolumeClaim:
        claimName: scratch-pvc-sandisk-cruzer

  containers:
    - name: test-script
      image: busybox
      command: [ "sh", "-c", "echo hello > /data/hello.txt && if [ \"$(cat /data/hello.txt)\" = hello ]; then echo 'read and write to volume worked!'; sleep 300; else exit 1; fi"]
      volumeMounts:
      - mountPath: "/data"
        name: scratch-pv

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scratch-pvc-sandisk-cruzer
spec:
  storageClassName: freeport-sandisk-cruzer
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
