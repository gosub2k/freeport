apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-csi-driver-pvc-armnode
spec:
  serviceName: test-csi-driver-pvc-armnode
  replicas: 1
  selector:
    matchLabels:
      app: test-csi-driver-pvc-armnode
  template:
    metadata:
      labels:
        app: test-csi-driver-pvc-armnode
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64
      volumes:
        - name: scratch-pv
          persistentVolumeClaim:
            claimName: scratch-pvc-armnode
      containers:
        - name: test-script
          image: busybox
          command: ["sh", "-c", "echo hello > /data/hello.txt && if [ \"$(cat /data/hello.txt)\" = hello ]; then echo 'read and write to volume worked!'; sleep 300; else exit 1; fi"]
          volumeMounts:
            - mountPath: "/data"
              name: scratch-pv
          livenessProbe:
            exec:
              command: ["echo", "OK"]
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scratch-pvc-armnode
spec:
  storageClassName: freeport-generic
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
