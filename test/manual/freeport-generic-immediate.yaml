# Same device class as freeport-generic (kustomize/base/storageclass-example.yaml)
# but Immediate binding instead of WaitForFirstConsumer, to exercise
# topology-aware provisioning with no consumer pod around to drive node
# selection — allowedTopologies below is what lets csi-provisioner pick a
# node without one. Device matching is entirely via that topology label, not
# StorageClass parameters — see the note at the top of storageclass-example.yaml.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: freeport-generic-immediate
provisioner: freeport.local
parameters:
  storageClassName: "freeport-generic-immediate"
volumeBindingMode: Immediate
reclaimPolicy: Retain
allowedTopologies:
  - matchLabelExpressions:
      - key: freeport.local/generic-usb-disk-2.0
        values: ["true"]
