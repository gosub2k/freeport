apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-csi-volume
spec:
  storageClassName: freeport-generic
  accessModes:
  - ReadWriteOnce  # NFS supports multiple writers!
  resources:
    requests:
      storage: 2Gi

