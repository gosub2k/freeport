apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: topology-followed-broad
spec:
  description: >
    Verifies the actual topology mechanism end to end, not just that
    binding happened: the PV backing scratch-pvc must carry a
    freeport.local/* nodeAffinity requirement, and the node the pod was
    actually scheduled to must carry a matching label — the same label
    pkg/manager sets from live USB device state. If this ever passes with
    an empty requirement list or a node that doesn't satisfy it,
    topology-based scheduling has silently stopped working.
    storageClassName comes from --values (see
    test/chainsaw/values.yaml.example) — a StorageClass whose
    allowedTopologies every node in your cluster currently satisfies — so
    this runs against any cluster's own set of freeport.local
    StorageClasses, not just the author's.
  bindings:
    - name: storageClassName
      value: ($values.storageClassName)
  timeouts:
    # Real USB-backed unmount (NodeUnpublishVolume) during pod teardown can
    # take well past chainsaw's 30s default cleanup/delete timeouts on
    # actual hardware — this isn't an emulated/mock driver.
    delete: 90s
    cleanup: 90s
  steps:
    - try:
        # storageClassName has no fallback — see basic-provisioning's guard
        # comment for why this must come first and be threaded through env.
        - script:
            env:
              - name: SC
                value: ($storageClassName)
            content: echo "using storageClassName=$SC"
        - apply:
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: scratch-pvc
              spec:
                storageClassName: ($storageClassName)
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
        - apply:
            resource:
              kind: Pod
              apiVersion: v1
              metadata:
                name: test-csi-driver-pvc
              spec:
                terminationGracePeriodSeconds: 2
                volumes:
                  - name: scratch-pv
                    persistentVolumeClaim:
                      claimName: scratch-pvc
                containers:
                  - name: test-script
                    image: busybox
                    command: ["sh", "-c", "sleep 300"]
                    volumeMounts:
                      - mountPath: "/data"
                        name: scratch-pv
        - assert:
            timeout: 60s
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: scratch-pvc
              status:
                phase: Bound
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -euo pipefail

              PV=$(kubectl get pvc -n "$NAMESPACE" scratch-pvc -o jsonpath='{.spec.volumeName}')

              # PVC turning Bound and the scheduler setting the pod's
              # nodeName are two independent controllers acting on two
              # different objects — not atomic, so nodeName can still be
              # empty for a moment right after the assert above passes.
              NODE=""
              for i in $(seq 1 30); do
                NODE=$(kubectl get pod -n "$NAMESPACE" test-csi-driver-pvc -o jsonpath='{.spec.nodeName}')
                if [ -n "$NODE" ]; then
                  break
                fi
                sleep 1
              done
              if [ -z "$NODE" ]; then
                echo "FAIL: pod never got a nodeName assigned" >&2
                exit 1
              fi
              echo "PV=$PV NODE=$NODE"

              PV_JSON=$(kubectl get pv "$PV" -o json)
              NODE_JSON=$(kubectl get node "$NODE" -o json)

              # portable pipes (printf | jq), not bash-only <<< here-strings —
              # chainsaw's script operation defaults to /bin/sh, which on
              # many systems is dash, not bash.
              REQUIRED_KEYS=$(printf '%s' "$PV_JSON" | jq -r '
                [.spec.nodeAffinity.required.nodeSelectorTerms[]?.matchExpressions[]?
                 | select(.key | startswith("freeport.local/")) | .key] | .[]
              ')

              if [ -z "$REQUIRED_KEYS" ]; then
                echo "FAIL: PV $PV has no freeport.local/* nodeAffinity requirement" >&2
                exit 1
              fi

              # No need to independently recompute "which node should this
              # have landed on" — if the node actually scheduled to
              # satisfies every required label, that already proves
              # topology worked, regardless of how many (or how few) nodes
              # could have qualified.
              printf '%s\n' "$REQUIRED_KEYS" | while IFS= read -r key; do
                want=$(printf '%s' "$PV_JSON" | jq -r --arg k "$key" '
                  .spec.nodeAffinity.required.nodeSelectorTerms[]?.matchExpressions[]?
                  | select(.key == $k) | .values[0]
                ')
                got=$(printf '%s' "$NODE_JSON" | jq -r --arg k "$key" '.metadata.labels[$k] // "MISSING"')
                echo "checking node label $key: want=$want got=$got"
                if [ "$got" != "$want" ]; then
                  echo "FAIL: node $NODE label $key=$got does not satisfy PV requirement $want" >&2
                  exit 1
                fi
              done

              echo "PASS: topology followed — PV $PV correctly pinned to node $NODE"
