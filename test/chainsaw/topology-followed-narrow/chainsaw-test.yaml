apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: topology-followed-narrow
spec:
  description: >
    Same check as topology-followed-broad, but against a StorageClass that
    only one node currently satisfies (not every node) — exercises that a
    narrow device class still resolves to correct, non-empty nodeAffinity.
    Bound from --values' narrowStorageClassName (see
    test/chainsaw/values.yaml.example) — a StorageClass whose
    allowedTopologies only some of your nodes currently satisfy — so this
    runs against any cluster's own set of freeport.local StorageClasses,
    not just the author's.
  bindings:
    - name: storageClassName
      value: ($values.narrowStorageClassName)
  timeouts:
    delete: 90s
    cleanup: 90s
  steps:
    - try:
        # storageClassName has no fallback — see basic-provisioning's guard
        # comment for why this must come first and be threaded through env.
        - script:
            env:
              - name: SC
                value: ($storageClassName)
            content: echo "using storageClassName=$SC"
        - apply:
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: scratch-pvc
              spec:
                storageClassName: ($storageClassName)
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
        - apply:
            resource:
              kind: Pod
              apiVersion: v1
              metadata:
                name: test-csi-driver-pvc
              spec:
                terminationGracePeriodSeconds: 2
                volumes:
                  - name: scratch-pv
                    persistentVolumeClaim:
                      claimName: scratch-pvc
                containers:
                  - name: test-script
                    image: busybox
                    command: ["sh", "-c", "sleep 300"]
                    volumeMounts:
                      - mountPath: "/data"
                        name: scratch-pv
        - assert:
            timeout: 60s
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: scratch-pvc
              status:
                phase: Bound
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -euo pipefail

              PV=$(kubectl get pvc -n "$NAMESPACE" scratch-pvc -o jsonpath='{.spec.volumeName}')

              NODE=""
              for i in $(seq 1 30); do
                NODE=$(kubectl get pod -n "$NAMESPACE" test-csi-driver-pvc -o jsonpath='{.spec.nodeName}')
                if [ -n "$NODE" ]; then
                  break
                fi
                sleep 1
              done
              if [ -z "$NODE" ]; then
                echo "FAIL: pod never got a nodeName assigned" >&2
                exit 1
              fi
              echo "PV=$PV NODE=$NODE"

              PV_JSON=$(kubectl get pv "$PV" -o json)
              NODE_JSON=$(kubectl get node "$NODE" -o json)

              REQUIRED_KEYS=$(printf '%s' "$PV_JSON" | jq -r '
                [.spec.nodeAffinity.required.nodeSelectorTerms[]?.matchExpressions[]?
                 | select(.key | startswith("freeport.local/")) | .key] | .[]
              ')

              if [ -z "$REQUIRED_KEYS" ]; then
                echo "FAIL: PV $PV has no freeport.local/* nodeAffinity requirement" >&2
                exit 1
              fi

              printf '%s\n' "$REQUIRED_KEYS" | while IFS= read -r key; do
                want=$(printf '%s' "$PV_JSON" | jq -r --arg k "$key" '
                  .spec.nodeAffinity.required.nodeSelectorTerms[]?.matchExpressions[]?
                  | select(.key == $k) | .values[0]
                ')
                got=$(printf '%s' "$NODE_JSON" | jq -r --arg k "$key" '.metadata.labels[$k] // "MISSING"')
                echo "checking node label $key: want=$want got=$got"
                if [ "$got" != "$want" ]; then
                  echo "FAIL: node $NODE label $key=$got does not satisfy PV requirement $want" >&2
                  exit 1
                fi
              done

              echo "PASS: topology followed — PV $PV correctly pinned to node $NODE"
