apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sandisk-any-topology
spec:
  description: >
    freeport-sandisk-any (kustomize/base/storageclass-example.yaml) has
    THREE OR'd allowedTopologies terms (sandisk-u3-cruzer-micro,
    sandisk-extreme, sandisk-cruzer) — only one needs to match. Currently
    only freeport.local/sandisk-extreme=true exists in this cluster (on
    node worker-1), so this specifically exercises that a StorageClass
    with multiple alternative device-class terms actually matches on
    whichever single one is real, not just the single-term case
    topology-followed already covers.
  timeouts:
    delete: 90s
    cleanup: 90s
  steps:
    - try:
        - apply:
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: scratch-pvc
              spec:
                storageClassName: freeport-sandisk-any
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
        - apply:
            resource:
              kind: Pod
              apiVersion: v1
              metadata:
                name: test-csi-driver-pvc
              spec:
                terminationGracePeriodSeconds: 2
                volumes:
                  - name: scratch-pv
                    persistentVolumeClaim:
                      claimName: scratch-pvc
                containers:
                  - name: test-script
                    image: busybox
                    command: ["sh", "-c", "sleep 300"]
                    volumeMounts:
                      - mountPath: "/data"
                        name: scratch-pv
        - assert:
            timeout: 60s
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: scratch-pvc
              status:
                phase: Bound
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -euo pipefail

              PV=$(kubectl get pvc -n "$NAMESPACE" scratch-pvc -o jsonpath='{.spec.volumeName}')

              NODE=""
              for i in $(seq 1 30); do
                NODE=$(kubectl get pod -n "$NAMESPACE" test-csi-driver-pvc -o jsonpath='{.spec.nodeName}')
                if [ -n "$NODE" ]; then
                  break
                fi
                sleep 1
              done
              if [ -z "$NODE" ]; then
                echo "FAIL: pod never got a nodeName assigned" >&2
                exit 1
              fi
              echo "PV=$PV NODE=$NODE"

              if [ "$NODE" != "worker-1" ]; then
                echo "FAIL: expected scheduling onto worker-1 (the only node with a matching sandisk class), got $NODE" >&2
                exit 1
              fi

              PV_JSON=$(kubectl get pv "$PV" -o json)
              NODE_JSON=$(kubectl get node "$NODE" -o json)

              REQUIRED_KEYS=$(printf '%s' "$PV_JSON" | jq -r '
                [.spec.nodeAffinity.required.nodeSelectorTerms[]?.matchExpressions[]?
                 | select(.key | startswith("freeport.local/")) | .key] | .[]
              ')

              if [ -z "$REQUIRED_KEYS" ]; then
                echo "FAIL: PV $PV has no freeport.local/* nodeAffinity requirement" >&2
                exit 1
              fi

              printf '%s\n' "$REQUIRED_KEYS" | while IFS= read -r key; do
                want=$(printf '%s' "$PV_JSON" | jq -r --arg k "$key" '
                  .spec.nodeAffinity.required.nodeSelectorTerms[]?.matchExpressions[]?
                  | select(.key == $k) | .values[0]
                ')
                got=$(printf '%s' "$NODE_JSON" | jq -r --arg k "$key" '.metadata.labels[$k] // "MISSING"')
                echo "checking node label $key: want=$want got=$got"
                if [ "$got" != "$want" ]; then
                  echo "FAIL: node $NODE label $key=$got does not satisfy PV requirement $want" >&2
                  exit 1
                fi
              done

              echo "PASS: sandisk-any topology followed — PV $PV correctly pinned to node $NODE"
