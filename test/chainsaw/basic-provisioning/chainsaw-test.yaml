apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: basic-provisioning
spec:
  description: >
    PVC provisioning happy path: a PVC binds, and the pod's own read/write
    check actually succeeds. storageClassName comes from --values (see
    test/chainsaw/values.yaml.example) — a StorageClass whose
    allowedTopologies every node in your cluster currently satisfies — so
    this runs against any cluster's own set of freeport.local
    StorageClasses, not just the author's.
  bindings:
    - name: storageClassName
      value: ($values.storageClassName)
  timeouts:
    # Real USB-backed unmount (NodeUnpublishVolume) during pod teardown can
    # take well past chainsaw's 30s default cleanup/delete timeouts on
    # actual hardware — this isn't an emulated/mock driver.
    delete: 90s
    cleanup: 90s
  steps:
    - try:
        # storageClassName has no fallback — if --values wasn't supplied,
        # this binding is null, and threading a null through env (which
        # requires a string) makes chainsaw itself error out here, before
        # anything gets applied. Without this guard, using the binding
        # directly in a resource field instead would just silently omit
        # storageClassName, letting the PVC bind against the cluster's
        # unrelated default StorageClass and pass without ever touching
        # this driver.
        - script:
            env:
              - name: SC
                value: ($storageClassName)
            content: echo "using storageClassName=$SC"
        - apply:
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: scratch-pvc
              spec:
                storageClassName: ($storageClassName)
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
        - apply:
            resource:
              kind: Pod
              apiVersion: v1
              metadata:
                name: test-csi-driver-pvc
              spec:
                terminationGracePeriodSeconds: 2
                volumes:
                  - name: scratch-pv
                    persistentVolumeClaim:
                      claimName: scratch-pvc
                containers:
                  - name: test-script
                    image: busybox
                    command: ["sh", "-c", "echo hello > /data/hello.txt && if [ \"$(cat /data/hello.txt)\" = hello ]; then echo 'read and write to volume worked!'; sleep 300; else exit 1; fi"]
                    volumeMounts:
                      - mountPath: "/data"
                        name: scratch-pv
        - assert:
            timeout: 60s
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: scratch-pvc
              status:
                phase: Bound
        - script:
            timeout: 90s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -euo pipefail
              # the container writes then reads back a file on the volume
              # and exits 1 on mismatch — with the default restart policy a
              # failed check can still leave the pod "Running" via kubelet's
              # restart loop, so check the log content directly rather than
              # trusting pod phase alone.
              for i in $(seq 1 40); do
                if kubectl logs -n "$NAMESPACE" test-csi-driver-pvc 2>/dev/null | grep -q "read and write to volume worked"; then
                  echo "PASS: pod confirmed read/write worked"
                  exit 0
                fi
                sleep 2
              done
              echo "FAIL: pod log never confirmed read/write success" >&2
              kubectl logs -n "$NAMESPACE" test-csi-driver-pvc || true
              exit 1
