# Test workload for manual testing.
# Depends on the storageclasses in overlays/example.
# Replace the storageclassnames below with your own.
#
# --- How to check it worked ---
#
# 1. PVC bound (WaitForFirstConsumer means it stays Pending until the pod
#    is scheduled):
#      kubectl -n freeport-test get pvc scratch-pvc-narrow -w
#
# 2. Pod landed on a node that actually has the device:
#      kubectl -n freeport-test get pods -l app=test-csi-driver-narrow -o jsonpath='{.items[0].spec.nodeName}'
#      kubectl get nodes -o json | jq -r '.items[] | select(.metadata.labels["freeport.local/sandisk-cruzer"]=="true") | .metadata.name'
#
# 3. Watch the live log in a browser — find the NodePort and open it on
#    any node's IP:
#      kubectl -n freeport-test get svc test-csi-driver-narrow -o jsonpath='{.spec.ports[0].nodePort}'
#      # then open http://<any-node-ip>:<that-port>/ — the page refreshes
#      # itself every second and should show a scrolling list of the last
#      # 100 timestamps written so far.
#
# 4. (optional) The actual topology mechanism, not just that it happened to
#    bind — the PV should carry a nodeAffinity requiring the label from step 2:
#      PV=$(kubectl -n freeport-test get pvc scratch-pvc-narrow -o jsonpath='{.spec.volumeName}')
#      kubectl get pv "$PV" -o jsonpath='{.spec.nodeAffinity}' | jq .
#
# 5. (optional) Manually test migration: unplug the SanDisk Cruzer from the
#    node found in step 2 and plug it into a different node, then watch
#      kubectl -n freeport-test get pods -l app=test-csi-driver-narrow -w
#    — the old pod should disappear and a new one appear, scheduled onto
#    the new node (the browser tab from step 3 will start erroring until
#    you point it at the new node's IP).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-csi-driver-narrow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-csi-driver-narrow
  template:
    metadata:
      labels:
        app: test-csi-driver-narrow
    spec:
      # busybox's `sh -c "... && sleep N"` doesn't forward SIGTERM to the
      # sleep promptly, so deletion otherwise sits at the default 30s grace
      # period.
      terminationGracePeriodSeconds: 2
      volumes:
        - name: scratch-pv
          persistentVolumeClaim:
            claimName: scratch-pvc-narrow
      containers:
        - name: writer
          image: busybox
          env:
            - name: K8S_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - "sh"
            - "-c"
            - "while true; do echo $(date) $K8S_NODE $(uname -n); sleep 1; done >> /data/log.txt"
          volumeMounts:
          - mountPath: "/data"
            name: scratch-pv
        - name: reader
          image: busybox
          command:
            - "sh"
            - "-c"
            - |
              while true; do
                {
                  echo '<html><head><meta http-equiv="refresh" content="1"></head><body>'
                  echo '<h1>freeport-sandisk-cruzer live log (last 100 lines)</h1><pre>'
                  tail -n 100 /data/log.txt 2>/dev/null
                  echo '</pre></body></html>'
                } > /data/index.html.tmp
                mv /data/index.html.tmp /data/index.html
                sleep 1
              done &
              exec httpd -f -p 8080 -h /data
          ports:
            - containerPort: 8080
          volumeMounts:
          - mountPath: "/data"
            name: scratch-pv
---
apiVersion: v1
kind: Service
metadata:
  name: test-csi-driver-narrow
spec:
  type: NodePort
  selector:
    app: test-csi-driver-narrow
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30808
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scratch-pvc-narrow
spec:
  storageClassName: freeport-sandisk-cruzer
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
