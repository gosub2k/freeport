# Sample StorageClasses for the freeport USB provisioner.
#
# Device matching is done entirely through topology, not parameters. Each
# node advertises one accessible-topology segment per USB device it finds,
# keyed as:
#
#   freeport.local/<manufacturer>-<model>=true
#
# (manufacturer/model are lowercased and sanitized by the node driver; a
# missing value falls back to "unknown"). A StorageClass picks the exact
# device class it wants via allowedTopologies — no regex, no globbing, one
# key per class. Combining more than one freeport.local/* key in a single
# matchLabelExpressions entry is an AND and will never match, since a device
# only ever carries one class key; use a separate StorageClass (or a
# separate term) per device class instead.
#
# storageClassName is still a required parameter — it's how the provisioner
# threads the StorageClass name through CreateVolume into the volume context.
#
# provisioner must match the CSI driver name: freeport.local
# StorageClasses are cluster-scoped — no namespace field.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: freeport-unknown-usb-disk
provisioner: freeport.local
parameters:
  storageClassName: "freeport-unknown-usb-disk"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowedTopologies:
  - matchLabelExpressions:
      - key: freeport.local/unknown-usb-disk-2.0
        values: ["true"]
---
# Matches any of several device classes: one term per class, since terms in
# allowedTopologies are OR'd together while keys within a single term are
# AND'd (see note above — never put multiple freeport.local/* keys in one
# matchLabelExpressions entry).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: freeport-sandisk-cruzer
provisioner: freeport.local
parameters:
  storageClassName: "freeport-sandisk-cruzer"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowedTopologies:
  - matchLabelExpressions:
      - key: freeport.local/sandisk-cruzer
        values: ["true"]
