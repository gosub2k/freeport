# Deployed automatically as part of this overlay (see kustomization.yaml) —
# no manual kubectl apply needed. This is here so the dev loop has
# something concrete to watch for testing freeport-sandisk-cruzer, which
# requires freeport.local/sandisk-cruzer=true — i.e. a real SanDisk Cruzer
# actually plugged into some node right now.
#
# --- How to check it worked ---
#
# 1. PVC bound (WaitForFirstConsumer means it stays Pending until the pod
#    is scheduled):
#      kubectl get pvc scratch-pvc-sandisk-cruzer -w
#
# 2. Pod landed on a node that actually has the device:
#      kubectl get pod test-csi-driver-sandisk-cruzer -o jsonpath='{.spec.nodeName}'
#      kubectl get nodes -o json | jq -r '.items[] | select(.metadata.labels["freeport.local/sandisk-cruzer"]=="true") | .metadata.name'
#
# 3. Read/write check inside the container succeeded:
#      kubectl logs test-csi-driver-sandisk-cruzer
#      # want: "read and write to volume worked!"
#
# 4. (optional) The actual topology mechanism, not just that it happened to
#    bind — the PV should carry a nodeAffinity requiring the label from step 2:
#      PV=$(kubectl get pvc scratch-pvc-sandisk-cruzer -o jsonpath='{.spec.volumeName}')
#      kubectl get pv "$PV" -o jsonpath='{.spec.nodeAffinity}' | jq .

kind: Pod
apiVersion: v1
metadata:
  name: test-csi-driver-sandisk-cruzer
spec:
  # busybox's `sh -c "... && sleep N"` doesn't forward SIGTERM to the sleep
  # promptly, so deletion otherwise sits at the default 30s grace period.
  terminationGracePeriodSeconds: 2

  volumes:
    - name: scratch-pv
      persistentVolumeClaim:
        claimName: scratch-pvc-sandisk-cruzer

  containers:
    - name: test-script
      image: busybox
      command: [ "sh", "-c", "echo hello > /data/hello.txt && if [ \"$(cat /data/hello.txt)\" = hello ]; then echo 'read and write to volume worked!'; sleep 300; else exit 1; fi"]
      volumeMounts:
      - mountPath: "/data"
        name: scratch-pv

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scratch-pvc-sandisk-cruzer
spec:
  storageClassName: freeport-sandisk-cruzer
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
