apiVersion: v1
kind: ServiceAccount
metadata:
  name: freeport-manager
  namespace: freeport
---
# Node RBAC has no per-object-name restriction, so this grants access to all
# Nodes cluster-wide. Each manager pod is trusted to only touch its own Node
# (matched by $NODE_NAME) — the same trust model already implicit in the
# daemonset's hostPID/privileged access to that node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: freeport-manager
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # CSINode is normally registrar-owned, but node-driver-registrar only
  # calls NodeGetInfo once at driver-pod startup, freezing whatever topology
  # it saw then — this manager keeps CSINode's topologyKeys current on every
  # reconcile tick instead (see pkg/manager/topologykeys.go). It only ever
  # updates an existing driver entry's TopologyKeys field, never creates one.
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch", "update"]
  # SECURITY-RELEVANT: cluster-wide PV and Pod access, for device migration
  # (see pkg/manager/migrate.go). This DaemonSet is already privileged /
  # hostPID / host-root on every node it runs on, so this doesn't cross a new
  # trust boundary for node compromise — but it does let a compromised or
  # buggy manager pod delete any namespace's Pods and any PersistentVolume in
  # the cluster, not just freeport-owned ones. There's no per-object-name or
  # per-namespace restriction available here (PVs are cluster-scoped; a
  # migrated device's volumes can back a claim in any namespace).
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "update", "delete", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: freeport-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: freeport-manager
subjects:
  - kind: ServiceAccount
    name: freeport-manager
    namespace: freeport
