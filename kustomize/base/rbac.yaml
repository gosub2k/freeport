apiVersion: v1
kind: ServiceAccount
metadata:
  name: freeport-manager
  namespace: freeport
---
# Node RBAC has no per-object-name restriction, so this grants access to all
# Nodes cluster-wide. Each manager pod is trusted to only touch its own Node
# (matched by $NODE_NAME) — the same trust model already implicit in the
# daemonset's hostPID/privileged access to that node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: freeport-manager
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: freeport-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: freeport-manager
subjects:
  - kind: ServiceAccount
    name: freeport-manager
    namespace: freeport
