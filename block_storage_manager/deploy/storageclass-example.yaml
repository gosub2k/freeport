# Sample StorageClass for the freeport USB provisioner.
#
# Match criteria live in `parameters`. All set fields must pass:
#   manufacturer  - sysfs manufacturer string (regex, see DeviceFilter)
#   model         - sysfs product string (regex or comma-separated list)
#   serial        - exact serial or comma-separated allowlist
#   type          - usb | nvme
#
# Leave a field empty / omit it to match anything.
#
# provisioner must match the CSI driver name: local.freeport
# StorageClasses are cluster-scoped — no namespace field.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: freeport-generic
provisioner: local.freeport
parameters:
  model: "USB DISK 2.0"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: freeport-boutique
provisioner: local.freeport
parameters:
  manufacterer: "LaCie,SanDisk"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
