apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: usbdevices.frankencluster.local
spec:
  group: frankencluster.local
  scope: Cluster
  names:
    plural: usbdevices
    singular: usbdevice
    kind: USBDevice
    shortNames:
      - usbdev
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.class
        - name: Node
          type: string
          jsonPath: .status.currentNode
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Product
          type: string
          jsonPath: .spec.model
          priority: 1
        - name: FS-UUID
          type: string
          jsonPath: .status.fsUUID
          priority: 1
        - name: Last-Seen
          type: date
          jsonPath: .status.lastSeen
        - name: Serial
          type: string
          jsonPath: .spec.serial
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["serial"]
              properties:
                serial:
                  type: string
                  description: USB device serial number (canonical identity).
                class:
                  type: string
                  description: |
                    Name of the matched USBDeviceClass. Empty if no class
                    matched the device.
                vendor:
                  type: string
                  description: Kernel-reported vendor string.
                model:
                  type: string
                  description: Kernel-reported product string.
                firstSeen:
                  type: string
                  format: date-time
            status:
              type: object
              properties:
                fsUUID:
                  type: string
                  description: Filesystem UUID (changes if the device is reformatted).
                currentNode:
                  type: string
                  description: Node that currently holds the device, or last held it.
                lastSeen:
                  type: string
                  format: date-time
                phase:
                  type: string
                  enum: ["Present", "Removed"]
                mountpoint:
                  type: string
