# One StorageClass per USB drive. Convention from the cluster CLAUDE.md is
# `usb-local-<id>`. The `uuid` parameter must equal the filesystem UUID of the
# drive (find it with `blkid` on the node).
#
# allowedTopologies makes the scheduler only place pods using this class on
# nodes labelled with the matching UUID. The DaemonSet adds those labels
# automatically when it sees the device in /dev/disk/by-uuid.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: usb-local-a
provisioner: frankencluster.local/usb-storage
parameters:
  uuid: "REPLACE-WITH-FILESYSTEM-UUID"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowedTopologies:
  - matchLabelExpressions:
      - key: usb-storage.frankencluster.local/uuid-REPLACE-WITH-FILESYSTEM-UUID
        values: ["true"]
