# A StorageClass references a USBDeviceClass via parameters.deviceClass.
# A single StorageClass can yield PVs on any drive that matches the class,
# on any node where one is plugged in.
#
# allowedTopologies makes the scheduler only place pods on nodes labelled
# with this class; the DaemonSet adds that label automatically when it sees
# a matching device.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: usb-local-cruzer
provisioner: frankencluster.local/usb-storage
parameters:
  deviceClass: "cruzer-blade"   # must equal a USBDeviceClass name
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowedTopologies:
  - matchLabelExpressions:
      - key: usb-storage.frankencluster.local/class-cruzer-blade
        values: ["true"]
