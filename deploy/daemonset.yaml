apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: usb-storage-provisioner
  namespace: dimsum
  labels:
    app: usb-storage-provisioner
spec:
  selector:
    matchLabels:
      app: usb-storage-provisioner
  template:
    metadata:
      labels:
        app: usb-storage-provisioner
    spec:
      serviceAccountName: usb-storage-provisioner
      # hostPID is required so nsenter --target 1 can reach the host's mount
      # namespace (and host's mkfs.ext4 / mount binaries via that namespace).
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: provisioner
          image: REPLACE_ME/usb-storage-provisioner:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PROVISIONER_NAMESPACE
              value: "dimsum"
            - name: POLL_INTERVAL
              value: "10"
            - name: HEALTH_PORT
              value: "8080"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
          securityContext:
            # privileged so the container can run nsenter into PID 1's mount
            # namespace and invoke mkfs / mount on the host.
            privileged: true
          volumeMounts:
            - name: host-data
              mountPath: /host/data
              mountPropagation: HostToContainer
            - name: host-dev-by-uuid
              mountPath: /host/dev/disk/by-uuid
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 192Mi
      volumes:
        - name: host-data
          hostPath:
            path: /data
            type: DirectoryOrCreate
        - name: host-dev-by-uuid
          hostPath:
            path: /dev/disk/by-uuid
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-proc
          # Bind-mounting /proc gives the container the host's procfs view —
          # /host/proc/1/mountinfo then reflects the host's mount namespace,
          # which we need to know what's mounted where.
          hostPath:
            path: /proc
---
# Headless Service so /health is reachable per-pod from outside the pod.
apiVersion: v1
kind: Service
metadata:
  name: usb-storage-provisioner
  namespace: dimsum
spec:
  clusterIP: None
  selector:
    app: usb-storage-provisioner
  ports:
    - name: health
      port: 8080
      targetPort: health
