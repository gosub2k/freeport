apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: blockdevices.freeport.local
spec:
  group: freeport.local
  # cluster-scoped: a BlockDevice represents node hardware, like Node / PV.
  scope: Cluster
  names:
    kind: BlockDevice
    singular: blockdevice
    plural: blockdevices
    shortNames:
      - bd
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [node, serial, type]
              # the provisioner owns every field; humans don't edit spec.
              # the CR exists iff the device is currently present.
              properties:
                node:
                  type: string
                  description: Node currently holding the device.
                manufacturer:
                  type: string
                model:
                  type: string
                serial:
                  type: string
                  description: Unique device serial; the CR is keyed on this.
                type:
                  type: string
                  enum: [usb, nvme]
                partition:
                  type: integer
                  minimum: 0
                # firstSeen:
                #   type: string
                #   format: date-time
                # lastSeen:
                #   type: string
                #   format: date-time
                # removedAt:
                #   # tombstone marker for soft deletes; null while Present.
                #   type: string
                #   format: date-time
                #   nullable: true
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .spec.node
        - name: Model
          type: string
          jsonPath: .spec.model
        - name: Serial
          type: string
          jsonPath: .spec.serial
        # - name: Phase
        #   type: string
        #   jsonPath: .spec.phase
        # - name: Age
        #   type: date
        #   jsonPath: .metadata.creationTimestamp
