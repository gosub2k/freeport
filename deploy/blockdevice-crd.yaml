apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: blockdevices.freeport.local
spec:
  group: freeport.local
  # cluster-scoped: a BlockDevice represents node hardware, like Node / PV.
  scope: Cluster
  names:
    kind: BlockDevice
    singular: blockdevice
    plural: blockdevices
    shortNames:
      - bd
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [node, serial, type]
              # the provisioner owns every field; humans don't edit spec.
              # the CR exists iff the device is currently present.
              properties:
                class:
                  type: string
                  description: Storage class managing the device
                serial:
                  type: string
                  description: Unique device serial; the CR is keyed on this.
                manufacturer:
                  type: string
                model:
                  type: string
                type:
                  type: string
                  enum: [usb, nvme]
                node:
                  type: string
                  description: Node currently holding the device.
                partition:
                  type: integer
                  minimum: 0
                  description: the first detected partition. Only the first is used.
                free:
                  type: integer
                  minimum: 0
                  description: Free space in bytes as seen by prlimit64() or similar.
                mountpoint:
                  type: string
                  description: Mountpoint on the host.
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.class
        - name: Node
          type: string
          jsonPath: .spec.node
        - name: Serial
          type: string
          jsonPath: .spec.serial
        - name: Model
          type: string
          jsonPath: .spec.model
        - name: Manufacturer
          type: string
          jsonPath: .spec.manufacturer
        - name: "MountPoint"
          type: string
          jsonPath: .spec.mountpoint
        - name: Partition
          type: integer
          jsonPath: .spec.partition
        - name: "Bytes Free"
          type: integer
          jsonPath: .spec.free
