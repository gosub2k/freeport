---
apiVersion: v1
kind: Namespace
metadata:
  name: dimsum
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: usb-storage-provisioner
  namespace: dimsum
---
# Cluster-scoped permissions: PVs, PVCs, StorageClasses, Nodes, and pods
# (the migration path needs to delete pods in any namespace so their
# controllers reschedule them onto the new node).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: usb-storage-provisioner
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    # patch is needed so we can write device-registry annotations
    # (usb-storage.frankencluster.local/dev.<serial>) on the SCs.
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: usb-storage-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: usb-storage-provisioner
subjects:
  - kind: ServiceAccount
    name: usb-storage-provisioner
    namespace: dimsum
---
# Namespace-scoped permissions: only Events. The models ConfigMap is mounted
# as a projected volume — kubelet handles that, no API access needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: usb-storage-provisioner
  namespace: dimsum
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: usb-storage-provisioner
  namespace: dimsum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: usb-storage-provisioner
subjects:
  - kind: ServiceAccount
    name: usb-storage-provisioner
    namespace: dimsum
